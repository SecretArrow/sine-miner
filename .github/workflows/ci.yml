name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permissions — minimal set. Pull requests get read-only; main gets checks write for status updates.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ===========================================================================
  # Rust core — check, fmt, clippy, test on host (no Android target needed)
  # ===========================================================================
  rust-check:
    name: Rust · check + fmt + clippy + test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + git
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: rust-host-${{ runner.os }}

      - name: Cargo fmt (check)
        working-directory: core
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        working-directory: core
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test (host)
        working-directory: core
        run: cargo test --all-features --no-fail-fast

  # ===========================================================================
  # Android — Kotlin lint + unit tests (Robolectric) — fast, no build needed
  # ===========================================================================
  android-lint-unit:
    name: Android · lint + unit test
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configuration-cache=true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            app/build
          key: gradle-unit-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-unit-${{ runner.os }}-

      - name: Gradle — spotless/check + lint + unit test (no native lib)
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/
          retention-days: 14
