name: E2E (instrumented)

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, opened]
  workflow_dispatch:

# Only run when the PR carries the "e2e" label OR on workflow_dispatch.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    name: Instrumented tests (API 29 emulator)
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'e2e') || github.event_name == 'workflow_dispatch'
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust toolchain (stable) + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^3

      - name: Cache Cargo + Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.gradle/caches
            .gradle
          key: e2e-${{ runner.os }}-${{ hashFiles('core/Cargo.toml', 'gradle/libs.versions.toml', '**/*.gradle*') }}
          restore-keys: |
            e2e-${{ runner.os }}-
            build-${{ runner.os }}-

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973 platforms;android-35 build-tools;35.0.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on API 29 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/
          retention-days: 14
