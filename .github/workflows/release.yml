name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build + publish release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configuration-cache=true"
      CARGO_TERM_COLOR: always
      # Pass secrets as env vars (always set; the build script checks for them).
      SINEMINER_KEYSTORE_BASE64: ${{ secrets.SINEMINER_KEYSTORE_BASE64 }}
      SINEMINER_KEYSTORE_PASSWORD: ${{ secrets.SINEMINER_KEYSTORE_PASSWORD }}
      SINEMINER_KEY_ALIAS: ${{ secrets.SINEMINER_KEY_ALIAS }}
      SINEMINER_KEY_PASSWORD: ${{ secrets.SINEMINER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^3

      - name: Cache Cargo + Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            ~/.gradle/caches
            .gradle
          key: release-${{ runner.os }}-${{ hashFiles('core/Cargo.toml', 'gradle/libs.versions.toml', '**/*.gradle*') }}
          restore-keys: |
            release-${{ runner.os }}-
            build-${{ runner.os }}-

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973 platforms;android-35 build-tools;35.0.0'

      - name: Decode signing keystore (if secret present)
        env:
          SINEMINER_KEYSTORE_BASE64: ${{ secrets.SINEMINER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SINEMINER_KEYSTORE_BASE64" ]; then
            echo "$SINEMINER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sineminer.keystore"
            echo "SINEMINER_KEYSTORE_FILE=$RUNNER_TEMP/sineminer.keystore" >> "$GITHUB_ENV"
            echo "✓ Keystore decoded"
          else
            echo "::warning::No release keystore secret — release APK will be unsigned (debug-signed fallback)"
          fi

      - name: Build Rust core for all ABIs (cargo-ndk → app/src/main/jniLibs/)
        working-directory: core
        continue-on-error: true
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          mkdir -p ../app/src/main/jniLibs/arm64-v8a ../app/src/main/jniLibs/x86_64
          for abi_target in "aarch64-linux-android:arm64-v8a" "x86_64-linux-android:x86_64"; do
            target="${abi_target%%:*}"
            abi="${abi_target##*:}"
            echo "Building Rust core for $abi ($target)…"
            cargo ndk -t "$target" -o "../app/src/main/jniLibs/$abi" -- build --release || \
              echo "::warning::Rust build for $abi failed — APK will ship without native lib; wallet/mining features will be disabled at runtime"
          done
          ls -la ../app/src/main/jniLibs/*/ || true

      - name: Assemble signed release APK + AAB (when keystore present)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          if [ -n "$SINEMINER_KEYSTORE_FILE" ]; then
            ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
          else
            echo "No keystore — falling back to ci build (unsigned)"
            ./gradlew :app:assembleCi --no-daemon --stacktrace
          fi

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: SineMiner ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          draft: false
          prerelease: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK + AAB as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SineMiner-release-${{ steps.ver.outputs.version }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          retention-days: 90
