name: Auto-fix

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
  schedule:
    - cron: '0 0 * * 1'  # weekly Monday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    name: Auto-fix lint/format issues + push PR
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo fmt (apply)
        working-directory: core
        run: cargo fmt --all

      - name: Cargo fix (clippy auto)
        working-directory: core
        run: cargo clippy --fix --allow-dirty --allow-staged --all-features || true

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create branch + commit + push
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH=auto-fix/${{ github.run_id }}
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: auto-fix lint/format ($(date -u +%Y-%m-%d))"
          git push origin "$BRANCH"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const branch = `auto-fix/${context.runId}`;
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 Auto-fix: lint + format ($(new Date().toISOString().slice(0,10)))`,
              head: branch,
              base: 'main',
              body: 'Automated lint + format fixes generated by the auto-fix workflow.',
            });
            core.info(`Opened PR #${pr.number}: ${pr.html_url}`);
            // Try to enable auto-merge
            try {
              await github.rest.pulls.enableAutoMerge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
            } catch (e) {
              core.info(`auto-merge not available: ${e.message}`);
            }
