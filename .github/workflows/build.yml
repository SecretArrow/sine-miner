name: Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK (with native Rust core)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configuration-cache=true -Dorg.gradle.jvmargs=-Xmx4g"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust toolchain (stable) + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version ^3

      - name: Cache Cargo + Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            ~/.gradle/caches
            .gradle
          key: build-${{ runner.os }}-${{ hashFiles('core/Cargo.toml', 'gradle/libs.versions.toml', '**/*.gradle*') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973 platforms;android-35 build-tools;35.0.0'

      - name: Build Rust core for all ABIs (cargo-ndk → app/src/main/jniLibs/)
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          mkdir -p ../app/src/main/jniLibs/arm64-v8a ../app/src/main/jniLibs/x86_64
          for abi_target in "aarch64-linux-android:arm64-v8a" "x86_64-linux-android:x86_64"; do
            target="${abi_target%%:*}"
            abi="${abi_target##*:}"
            echo "Building $abi ($target)…"
            cargo ndk -t "$target" -o "../app/src/main/jniLibs/$abi" -- build --release || \
              echo "::warning::Rust build for $abi failed — APK will not include native lib"
          done
          ls -la ../app/src/main/jniLibs/*/ || true

      - name: Assemble debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SineMiner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Rust build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-build-logs
          path: core/target/
          retention-days: 7
          if-no-files-found: ignore
